version: '3.9'

services:
  php:
    build: .
    platform: linux/amd64
    volumes:
      - ./src:/var/www/html
    ports:
      - 9292:80

  mysql:
    image: mysql:5.7
    platform: linux/amd64
    restart: always
    volumes:
      - db_data:/var/lib/mysql
      - ./src/scripts/init:/docker-entrypoint-initdb.d:ro
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ciberseguridad
      MYSQL_USER: ciberseguridad
      MYSQL_PASSWORD: Admin123
    command: --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    restart: always
    ports:
      - 9191:80
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
      UPLOAD_LIMIT: 100M

volumes:
  db_data:
